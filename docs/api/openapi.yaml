openapi: 3.0.3
info:
  title: API Trotamundos
  description: Contrato de la API para el sistema de gestión de viajes Trotamundos (Spec-Driven Development).
  version: 1.0.0
servers:
  - url: http://localhost:8080/api/v1
paths:
  /viajes:
    get:
      summary: Obtiene los itinerarios activos del usuario.
      tags:
        - Viajes
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de viajes con sus reservas asociadas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Viaje'

  /recomendaciones:
    get:
      summary: Obtiene sugerencias pre-calculadas de alojamiento y transporte.
      description: Lectura ultrarrápida (< 800ms) desde la persistencia de IA optimizada.
      tags:
        - Recomendaciones
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de recomendaciones personalizadas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Recomendacion'

  /recomendaciones/{id}/feedback:
    post:
      summary: Envía feedback sobre una recomendación (Human-in-the-loop).
      description: Operación asíncrona. Encola un evento en el Broker para ajustar los pesos del perfil del usuario sin bloquear el hilo principal.
      tags:
        - Recomendaciones
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID de la recomendación evaluada
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
      responses:
        '202':
          description: Feedback aceptado y encolado para su procesamiento asíncrono.
        '400':
          description: Acción de feedback inválida.

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT provisto por el Identity Provider (Stateless SSO).

  schemas:
    Viaje:
      type: object
      properties:
        id:
          type: string
        nombre:
          type: string
          example: "Vacaciones en Bariloche"
        estado:
          type: string
          enum: [activo, finalizado, archivado]

    Recomendacion:
      type: object
      properties:
        id:
          type: string
        tipo:
          type: string
          enum: [alojamiento, transporte, ruta]
        titulo:
          type: string
          example: "Hotel Llao Llao - Oferta exclusiva"
        match_score:
          type: number
          format: float
          example: 0.95
          description: Porcentaje de afinidad calculado por el algoritmo.

    FeedbackRequest:
      type: object
      required:
        - accion
      properties:
        accion:
          type: string
          enum: [aceptar, rechazar]
          example: "rechazar"